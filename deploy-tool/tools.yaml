sources:
  alloydb-pg-source:
    kind: postgres
    host: ${DB_HOST}
    port: 5432
    user: ${DB_USER}
    password: ${DB_PASS}
    database: ${DB_NAME}
tools:
  search-product-recommendations:
    kind: postgres-sql
    source: alloydb-pg-source
    description: >-
      Search for products based on user needs.
      Use this tool to search for products. This tool requires the user's needs.
    parameters:
      - name: query
        type: string
        description: The product characteristics
    statement: |
      SELECT
        plu AS product_id,
        product_name AS name,
        product_description AS description,
        atribut AS attributes
      FROM
        products
      ORDER BY
        embedding('gemini-embedding-001', $1)::vector <=> embedding
      LIMIT 5;
  update-product-attributes:
    kind: postgres-sql
    source: alloydb-pg-source
    description: >-
      Update or add attributes to a product.
      Use this tool to set or update the attributes array of a product.
      This tool requires the product PLU (product ID) and the list of attributes in JSON array format.
    parameters:
      - name: plu
        type: string
        description: The PLU (unique identifier) of the product.
      - name: attributes
        type: string
        description: A JSON array string of attributes (e.g. '[{"name": "Country of Origin", "value": "France"}, {"name": "Type of Grape", "value": "Cabernet Sauvignon"}]').
    statement: |
      UPDATE products
      SET 
        atribut = ARRAY(SELECT jsonb_array_elements($2::jsonb)::text),
        updated_at = CURRENT_TIMESTAMP
      WHERE 
        plu = $1;
toolsets:
  my-toolset:
    - search-product-recommendations
    - update-product-attributes